<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Classement">
    <title>Classement</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header>
        <nav class="flex items-center justify-between w-full px-10 h-[60px] bg-[#F7F9F5] border-b border-[#DDE4DB]">
            <a href="#" class="text-[#183D32] text-lg font-extrabold italic">FL/ FitLeague</a>
            <ul class="flex items-center gap-2 text-[10px] font-medium text-[#183D32]">
                <li><a href="#accueil"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Accueil</a>
                </li>
                <li><a href="#classement"
                        class="nav-link active block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Classement</a>
                </li>
                <li><a href="#defis"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Défis</a>
                </li>
                <li><a href="#participants"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Participants</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="flex flex-col gap-1.5 pt-10 pl-14 pb-9 font-sans">
            <h1 class="text-[52px] font-extrabold text-[#143B32]">Classement</h1>
            <p class="text-[14px] font-normal text-[#143B32]">On se motive, on se dépasse, on se retrouve sur le podium.
            </p>
        </div>
        <div class="w-full max-w-350 mx-auto">
            <div
                class="flex justify-between items-center text-[10px] font-bold text-[#A3B2A6] px-6 pb-4">
                <div class="flex gap-8">
                    <p>RANK</p>
                    <p>NOM</p>
                </div>
                <p>POINTS</p>
            </div>

            <div class="flex flex-col gap-2">
                <div
                    class="flex justify-between items-center bg-[#D2F196] rounded-xl p-4 px-6 shadow-sm border border-[#C5E787]">
                    <div class="flex items-center gap-6">
                        <p class="text-base font-extrabold text-[#0D382A]">01</p>
                        <div class="flex items-center gap-3">
                            <p class="text-sm font-bold text-[#0D382A]">Camille Martin</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-extrabold text-[#0D382A] leading-tight">320</div>
                        <div class="text-[10px] font-medium text-[#5B6E5F] -mt-1">points</div>
                    </div>
                </div>
                <div
                    class="flex justify-between items-center bg-white rounded-xl p-4 px-6 border border-[#EBEFEA] shadow-xs">
                    <div class="flex items-center gap-6">
                        <p class="text-base font-extrabold text-[#0D382A]">02</p>
                        <div class="flex items-center gap-3">
                            <p class="text-sm font-bold text-[#0D382A]">Alex Bernard</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-extrabold text-[#0D382A] leading-tight">285</div>
                        <div class="text-[10px] font-medium text-[#A3B2A6] -mt-1">points</div>
                    </div>
                </div>
                <div
                    class="flex justify-between items-center bg-white rounded-xl p-4 px-6 border border-[#EBEFEA] shadow-xs">
                    <div class="flex items-center gap-6">
                        <p class="text-base font-extrabold text-[#0D382A]">03</p>
                        <div class="flex items-center gap-3">
                            <p class="text-sm font-bold text-[#0D382A]">Inès Dubois</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-extrabold text-[#0D382A] leading-tight">260</div>
                        <div class="text-[10px] font-medium text-[#A3B2A6] -mt-1">points</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

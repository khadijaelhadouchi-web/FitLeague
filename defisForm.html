<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <header>
        <nav class="flex items-center justify-between w-full px-10 h-[60px] bg-[#F7F9F5] border-b border-[#DDE4DB]">
            <a href="#" class="text-[#183D32] text-lg font-extrabold italic">FL/ FitLeague</a>
            <ul class="flex items-center gap-2 text-[10px] font-medium text-[#183D32]">
                <li><a href="#accueil"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Accueil</a>
                </li>
                <li><a href="#classement"
                        class="nav-link active block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Classement</a>
                </li>
                <li><a href="#defis"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Défis</a>
                </li>
                <li><a href="#participants"
                        class="nav-link block px-3 py-2 rounded-full hover:bg-[#C9E98B] transition-colors">Participants</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="bg-[#F7F9F5] p-8">
            <a href="">← Retour aux défis</a>
            <h2 class="text-[45px] font-bold text-[#183D32] ">Ajouter un défi</h2>
        </div>
        <section class="bg-[#F7F9F5] p-8">
            <div>
                <form action="" class="">
                    <di class="flex text-[#183D32] flex-col  "> <label for="">Nom de défi *</label> <br><input
                            type="text" placeholder="Le Tour du lac " class="border-1 rounded-sm"></di>
                    <div class="flex place-content-between">
                        <di class="flex text-[#183D32] flex-col "> <label for=""> Sport *</label> <br><input type="text"
                                placeholder="Cycliseme" class="border-1  rounded-sm"></di>
                        <di class="flex text-[#183D32] flex-col "> <label for=""> Objectif *</label> <br><input
                                type="text" placeholder="60" class="border-1 rounded-sm"></di>
                    </div>
                    <div class="flex place-content-between">
                        <di class="flex text-[#183D32] flex-col "> <label for="">Début *</label> <br><input type="text"
                                placeholder="21/06/2026" class="border-1 rounded-sm"></di>
                        <di class="flex text-[#183D32] flex-col "> <label for="">Fin *</label> <br><input type="text"
                                placeholder="28/06/2026" class="border-1 rounded-sm"></di>
                    </div>
                    <di class="flex text-[#183D32] flex-col "> <label for="">Unité *</label> <br><input type="text"
                            class="border-1 rounded-sm"
                            placeholder="Une semaine pour découvrir les routes autour du lac. Chacun roule à son rythme et ajoute ses sorties. On termine ensemble dimanche !">
                    </di>
                </form>
            </div>
            <div class="mt-6 ">
                <button class="border-1 rounded-sm bg-[#143B32] text-[#F7F9F4] p-1 ">Créer le défi</button><button
                    class="border-1 rounded-sm p-1"> Annuler</button>
            </div>

        </section>
    </main>
</body>

</html>
